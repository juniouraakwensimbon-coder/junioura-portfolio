<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recovered backgrounds</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #F3F6F8; color: #142B45; font-family: system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; display: grid; gap: 40px; }
  h1 { font-size: 1.5rem; margin: 0; }
  figure { margin: 0; }
  img { display: block; width: 100%; height: auto; border: 1px solid #D5DDE3; border-radius: 6px; background: #fff; }
  figcaption { margin-top: 10px; line-height: 1.5; }
  code { background: #fff; padding: 1px 5px; border-radius: 3px; }
</style>
</head>
<body>
<main>
  <h1>Recovered website backgrounds</h1>
  <figure>
    <img src="hero-background.png" alt="Hero background: icy blue with yellow and navy curves">
    <figcaption><strong>1. Home page hero section</strong><br><code>hero-background.png</code>, 1672 × 941. Used on the website as <code>public/images/branding/hero-background.webp</code>.</figcaption>
  </figure>
  <figure>
    <img src="professional-background.png" alt="Professional Background section background: pale blue with soft arcs and a teal and navy curve">
    <figcaption><strong>2. Professional Background section</strong><br><code>professional-background.png</code>, 1993 × 789. Used on the website as <code>public/images/professional-background-bg.png</code>.</figcaption>
  </figure>
</main>
</body>
</html>
